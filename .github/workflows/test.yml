# Runs every self-check, then a real install, check and uninstall, on Windows, Mac and Linux.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.13"]
        include:
          - os: macos-latest
            python: system   # the Python a Mac ships with (Apple's 3.9), what most friends will have
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on Windows, like Claude Code's Bash tool
    env:
      PY: ${{ matrix.python == 'system' && '/usr/bin/python3' || 'python' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}

      - name: Self-checks
        run: |
          "$PY" --version
          fail=0
          for t in tests/test_*.py; do echo "== $t"; "$PY" "$t" || fail=1; done
          exit $fail

      - name: Install, check and remove the kit
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude config
        run: |
          "$PY" install.py
          "$PY" install.py --check
          "$PY" install.py --uninstall
          test ! -e "$CLAUDE_CONFIG_DIR/hooks/build-kit"
          "$PY" -c "import json, os; s = json.load(open(os.path.join(os.environ['CLAUDE_CONFIG_DIR'], 'settings.json'))); assert 'hooks' not in s, s"
